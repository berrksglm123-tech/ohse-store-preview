<!DOCTYPE html>
<!-- Created by Kayra Gumus -->
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="author" content="Kayra Gumus">
<meta name="theme-color" content="#000000">
<title>OHSE</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<style>
*{box-sizing:border-box;margin:0;padding:0}

body{
  min-height:100vh;
  min-height:100dvh;
  background:#000;
  color:#fff;
  font-family:Inter,system-ui,sans-serif;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:24px;
}

.bg{
  position:fixed;
  inset:0;
  background:url("bg.jpg") center/cover no-repeat;
  filter:brightness(.5);
  z-index:-2;
}

.overlay{
  position:fixed;
  inset:0;
  background:radial-gradient(circle at 50% 38%,rgba(255,255,255,.09),rgba(0,0,0,.94));
  z-index:-1;
}

.card{
  position:relative;
  overflow:hidden;
  width:min(452px,100%);
  background:rgba(0,0,0,.34);
  border:1px solid rgba(255,255,255,.12);
  border-radius:26px;
  padding:22px 24px 28px;
  text-align:center;
  backdrop-filter:blur(12px);
  -webkit-backdrop-filter:blur(12px);
  box-shadow:0 24px 70px rgba(0,0,0,.55);
  animation:rise .7s cubic-bezier(.16,1,.3,1) both;
}

.card > *{ position:relative; z-index:1; }

@keyframes rise{
  from{opacity:0;transform:translateY(18px) scale(.98)}
  to{opacity:1;transform:none}
}

/* language toggle */
.lang{
  display:flex;
  justify-content:flex-end;
  font-size:12px;
  font-weight:600;
  letter-spacing:.12em;
  user-select:none;
}
.lang span{cursor:pointer;transition:color .2s ease}
.lang .sep{color:#5a5a5a;margin:0 6px;cursor:default}
.lang .off{color:#6d6d6d}
.lang .off:hover{color:#c9c9c9}

/* chrome drip logo — mixtape-style glow + hanging swing */
.logo{
  display:block;
  width:min(206px,62%);
  height:auto;
  margin:4px auto 0;
  user-select:none;
  -webkit-user-drag:none;
  filter:drop-shadow(0 4px 12px rgba(0,0,0,.55)) drop-shadow(0 0 18px rgba(255,255,255,.14));
  transform-origin:50% 7%;
  animation:swing 3.6s ease-in-out infinite;
  will-change:transform;
}

@keyframes swing{
  0%,100%{ transform:rotate(-3.2deg); }
  50%    { transform:rotate(3.2deg); }
}

@media (prefers-reduced-motion:reduce){
  .logo{ animation:none; }
}

.sub{
  margin-top:8px;
  font-size:11px;
  letter-spacing:.36em;
  text-transform:uppercase;
  color:rgba(255,255,255,.62);
}

.foot{
  margin-top:22px;
  font-size:10px;
  font-weight:600;
  line-height:1.5;
  letter-spacing:.24em;
  text-transform:uppercase;
  color:rgba(255,255,255,.5);
}

.buttons{
  margin-top:26px;
  display:flex;
  flex-direction:column;
  gap:13px;
}

.btn{
  position:relative;
  display:flex;
  align-items:center;
  gap:14px;
  padding:15px 18px;
  border-radius:15px;
  border:1px solid rgba(255,255,255,.16);
  background:rgba(255,255,255,.03);
  color:#fff;
  text-decoration:none;
  font-size:13px;
  font-weight:600;
  letter-spacing:.24em;
  text-transform:uppercase;
  transition:.22s ease;
}
.btn .ico{
  width:20px;height:20px;flex:0 0 auto;
  display:flex;align-items:center;justify-content:center;
  opacity:.9;
}
.btn .ico svg{width:100%;height:100%;display:block}
.btn .label{flex:1;text-align:left}
.btn .arrow{
  opacity:.35;flex:0 0 auto;
  transition:transform .22s ease,opacity .22s ease;
}
.btn:hover{
  background:rgba(255,255,255,.08);
  border-color:rgba(255,255,255,.32);
  box-shadow:0 0 22px rgba(255,255,255,.12);
  transform:translateY(-2px);
}
.btn:hover .arrow{opacity:.8;transform:translateX(3px)}

/* primary (store) */
.btn.primary{
  background:#fff;
  color:#000;
  border-color:#fff;
}
.btn.primary .arrow{opacity:.45}
.btn.primary:hover{
  background:#f0f0f0;
  box-shadow:0 0 26px rgba(255,255,255,.28);
}

@media (max-width:380px){
  .btn{letter-spacing:.18em}
}
</style>
</head>

<body>
<div class="bg"></div>
<div class="overlay"></div>

<div class="card">
  <div class="lang" role="group" aria-label="Language">
    <span data-lang="en">EN</span><span class="sep">|</span><span data-lang="tr">TR</span>
  </div>

  <img class="logo" src="assets/ohse-drip-logo.png" alt="OHSE">
  <div class="sub" data-i18n="sub">Choose your path</div>

  <div class="buttons">
    <a class="btn primary" href="https://www.ohse.store">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 2 3 6v14a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>
      </span>
      <span class="label" data-i18n="store">Store</span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a class="btn" href="https://instagram.com/ohse.twch">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5.5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1.2" fill="currentColor" stroke="none"/></svg>
      </span>
      <span class="label">Instagram</span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>

    <a class="btn" href="https://tiktok.com/@ohse.twch">
      <span class="ico" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor" stroke="none"><path d="M16.5 3c.3 2.2 1.6 3.8 3.9 4v2.6c-1.4.1-2.7-.3-3.9-1v6.1a5.7 5.7 0 1 1-5.7-5.7c.3 0 .6 0 .9.1v2.7a3 3 0 1 0 2.1 2.9V3h2.7Z"/></svg>
      </span>
      <span class="label">TikTok</span>
      <span class="arrow" aria-hidden="true">&rarr;</span>
    </a>
  </div>

  <div class="foot" data-i18n="foot">The world is in a child's hands</div>
</div>

<script>
(function(){
  var T={
    en:{sub:"Choose your path", store:"Store",  foot:"The world is in a child's hands"},
    tr:{sub:"Yolunu seç",        store:"Mağaza", foot:"The world is in a child's hands"}
  };

  function apply(lang){
    document.documentElement.lang=lang;
    var d=T[lang]||T.en;
    document.querySelectorAll("[data-i18n]").forEach(function(el){
      var k=el.getAttribute("data-i18n");
      if(d[k]!=null) el.textContent=d[k];
    });
    document.querySelectorAll(".lang [data-lang]").forEach(function(s){
      s.classList.toggle("off", s.getAttribute("data-lang")!==lang);
    });
    try{localStorage.setItem("ohse_lang",lang);}catch(e){}
  }

  // Default English on first open; remember visitor's later choice.
  var saved;
  try{saved=localStorage.getItem("ohse_lang");}catch(e){}
  apply(saved==="tr"?"tr":"en");

  document.querySelectorAll(".lang [data-lang]").forEach(function(s){
    s.addEventListener("click",function(){ apply(s.getAttribute("data-lang")); });
  });
})();
</script>
</body>
</html>
